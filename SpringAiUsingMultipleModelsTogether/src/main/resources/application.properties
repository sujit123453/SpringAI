spring.application.name=SpringAIWithOllama
server.port=8081

#configuration ollama with springboot
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=codellama:latest
spring.ai.ollama.chat.temperature=0.7

#setup for openAI
spring.ai.openai.api-key=${OPENAI_KEY_VALUE}
#spring.ai.openai.chat.options.model=gpt-4.1
#spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.model=gpt-4.1
spring.ai.openai.chat.temperature=0.2

